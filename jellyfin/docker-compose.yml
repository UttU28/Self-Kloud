name: selfhosted-jellyfin

services:
  jellyfin:
    # Official Hub (stable): jellyfin/jellyfin:latest
    # Custom forks (uttu28 hide-items): set JELLYFIN_IMAGE in .env
    image: ${JELLYFIN_IMAGE:-jellyfin/jellyfin:hide-items-amd64}
    container_name: jellyfin
    restart: unless-stopped
    user: "${JELLYFIN_UID:-1000}:${JELLYFIN_GID:-1000}"
    ports:
      - "0.0.0.0:8096:8096"
    env_file:
      - .env
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    gpus: all
    volumes:
      - ${JELLYFIN_CONFIG_PATH:-./config}:/config
      # :ro is safer (Jellyfin cannot delete/modify library files).
      # Drop :ro so Dashboard "Delete" can remove files on disk.
      - ${MEDIA_PATH:-./media}:/media
      # - ${MEDIA_PATH:-./media}:/media:ro
